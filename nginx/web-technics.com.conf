# Drop this file into the Nginx http context (commonly /etc/nginx/conf.d/)
# after confirming the certificate paths used by this host.
server {
    listen 80;
    listen [::]:80;
    server_name web-technics.com www.web-technics.com;

    return 301 https://web-technics.services$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web-technics.com www.web-technics.com;

    # Reuse the existing web-technics.com certificate configuration here.
    ssl_certificate /etc/letsencrypt/live/web-technics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-technics.com/privkey.pem;

    return 301 https://web-technics.services$request_uri;
}
